services:
  postgres:
    image: postgres:17-alpine
    container_name: agroniaga_tbs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agroniaga_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agroniaga_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agroniaga_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agroniaga_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agroniaga_dev} -d ${POSTGRES_DB:-agroniaga_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: agroniaga_tbs_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - agroniaga_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  agroniaga_postgres_data:
  agroniaga_redis_data:
