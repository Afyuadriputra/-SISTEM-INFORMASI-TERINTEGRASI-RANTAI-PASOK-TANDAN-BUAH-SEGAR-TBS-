[project]
name = "agroniaga-tbs-backend"
version = "0.1.0"
description = "Backend Modular Monolith FastAPI — Sistem Informasi Terintegrasi Rantai Pasok TBS Perumda Tuah Sekata (Unit Agro Niaga)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "argon2-cffi>=23.1.0,<26.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "redis>=5.2.0,<6.0.0",
  "sqlalchemy>=2.0.36,<2.1.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "hypothesis>=6.115.0,<7.0.0",
  "import-linter>=2.1,<3.0",
  "locust>=2.32.0,<3.0.0",
  "pyright>=1.1.389,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "ruff>=0.7.0,<1.0.0",
  "schemathesis>=3.38.0,<4.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error::DeprecationWarning",
  "ignore:jsonschema\\.exceptions\\.RefResolutionError is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "N", "W"]
ignore = ["B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"app/core/exceptions.py" = ["E501"]
"tests/**" = ["S101", "S105", "S106", "E501"]
"alembic/**" = ["I001"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = [".venv", "alembic"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core primitives and exceptions remain independent of HTTP, ORM, and Redis adapters"
type = "forbidden"
source_modules = [
  "app.core.config",
  "app.core.exceptions",
  "app.core.idempotency_primitives",
  "app.core.logging",
  "app.core.schemas",
  "app.core.security",
  "app.core.weight_primitives",
]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "redis",
  "psycopg",
  "alembic",
  "app.core.health",
  "app.core.middleware",
  "app.main",
]

[[tool.importlinter.contracts]]
name = "Database, audit, and Redis adapters must not import HTTP composition or middleware"
type = "forbidden"
source_modules = [
  "app.core.audit",
  "app.core.database",
  "app.core.idempotency",
  "app.core.redis",
  "app.core.system_rules",
]
forbidden_modules = [
  "fastapi",
  "starlette",
  "app.core.health",
  "app.core.middleware",
  "app.main",
]

[[tool.importlinter.contracts]]
name = "Clean Architecture four-layer isolation inside active domain modules"
type = "layers"
layers = [
  "app.modules.identity_access.presentation",
  "app.modules.identity_access.application",
  "app.modules.identity_access.domain",
]

