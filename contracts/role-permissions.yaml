  - { code: payments.record, module: reconciliation, resource: payment_records, action: record, description: "Mencatat referensi dan bukti pembayaran masuk/keluar." }
  - { code: payments.verify, module: reconciliation, resource: payment_records, action: verify, description: "Memverifikasi keabsahan bukti bayar atau mencatat reversal (Maker != Checker)." }
