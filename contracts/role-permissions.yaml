# Canonical Role-Permission, Scope & Separation-of-Duties Matrix
# Project: AgroNiaga TBS — Perumda Tuah Sekata
# Authority: PRD V1.1 (§4), TRD V1.1 (§12), DBD V1.1 (§6), BSD V1.1 (§4-5)
# Policy: Default-deny on server; frontend menu hiding never replaces server RBAC & scope checks (TRD §12.4).

version: "1.0.0"
contract_baseline: "M0-V1.1"
authorization_default: "DENY_BY_DEFAULT"

# =============================================================================
# 1. CANONICAL ACTORS & ROLES
# =============================================================================
actors:
  - role_code: PUBLIC
    prd_code: ROLE-01
    actor_type: anonymous
    database_account: false
    description: "Pengunjung masyarakat umum tanpa akun database dan tanpa login. Hanya mengakses informasi terkurasi Portal Publik (FR-PUB-001)."
    default_scope: PUBLIC_NONE
    allowed_scopes: [PUBLIC_NONE]

roles:
  - role_code: FARMER
    prd_code: ROLE-02
    name: "Petani Swadaya"
    description: "Melihat profil kebun pribadi, riwayat panen, hasil penimbangan, dan status pembayaran miliknya secara read-only (BR-MD-004, FLOW-20)."
    default_scope: FARMER
    allowed_scopes: [FARMER]
    ui_portal_base: "/app/petani"

  - role_code: COOPERATIVE_OPERATOR
    prd_code: ROLE-03
    name: "Operator Koperasi"
    description: "Mengelola data petani/kebun dalam cakupan koperasinya (FLOW-05), mencatat penerimaan TBS, penimbangan, grading, serta menyiapkan/menerbitkan e-DO (tergantung BSD-DEC-009)."
    default_scope: COOPERATIVE
    allowed_scopes: [COOPERATIVE]
    ui_portal_base: "/app/koperasi"

  - role_code: PERUMDA_OPERATIONS
    prd_code: ROLE-04_OPS
    name: "Staf Operasional Perumda"
    description: "Mengelola master data PKS & publikasi (FLOW-06), input/verifikasi/publikasi harga multi-PKS, kontrak & kuota, penentuan PKS tujuan, monitoring e-DO, dan rekonsiliasi timbang."
    default_scope: PERUMDA_GLOBAL
    allowed_scopes: [PERUMDA_GLOBAL]
    ui_portal_base: "/app/perumda"

  - role_code: PERUMDA_FINANCE
    prd_code: ROLE-04_FIN
    name: "Staf Keuangan Perumda"
    description: "Menyiapkan dan memeriksa faktur AR/AP terpisah, mengajukan persetujuan pembayaran, mencatat bukti pembayaran masuk/keluar, dan memverifikasi pelunasan sesuai SOP."
    default_scope: PERUMDA_GLOBAL
    allowed_scopes: [PERUMDA_GLOBAL]
    ui_portal_base: "/app/perumda/pembayaran"

  - role_code: MILL_OPERATOR
    prd_code: ROLE-05
    name: "Petugas PKS"
    description: "Memverifikasi e-DO yang ditujukan khusus ke PKS miliknya, mencatat tiket timbang PKS, grading pabrik, dan revisi sebelum penguncian faktur."
    default_scope: MILL
    allowed_scopes: [MILL]
    ui_portal_base: "/app/pks"

  - role_code: DIRECTOR
    prd_code: ROLE-06
    name: "Direksi Perumda"
    description: "Memantau dashboard eksekutif tonase/rekonsiliasi/keuangan, menyetujui kontrak, penyelesaian dispute bermasalah, dan persetujuan pembayaran sesuai batas kewenangan."
    default_scope: PERUMDA_GLOBAL
    allowed_scopes: [PERUMDA_GLOBAL]
    ui_portal_base: "/app/direksi"

  - role_code: SYSTEM_ADMIN
    prd_code: ROLE-07
    name: "Administrator Sistem"
    description: "Mengelola akun, pemberian peran/scope, registrasi konfigurasi teknis, memantau log audit & CCTV Digital. DILARANG menjadi approver/verifikator transaksi bisnis atau keuangan (BR-SYS-002)."
    default_scope: PERUMDA_GLOBAL
    allowed_scopes: [PERUMDA_GLOBAL]
    ui_portal_base: "/app/admin"
    non_approver_enforcement: "BR-SYS-002"

# =============================================================================
# 2. RESOURCE SCOPES (DBD §6.6)
# =============================================================================
scopes:
  - scope_type: PUBLIC_NONE
    isolation_column: null
    rule: "Hanya membaca endpoint /api/v1/public/* yang terverifikasi & diizinkan publik."
  - scope_type: FARMER
    isolation_column: farmer_id
    rule: "Wajib menunjuk tepat satu farmer_id aktif pada user_access_scopes. Hanya dapat membaca data kebun, penerimaan, dan alokasi pembayaran petani tersebut."
  - scope_type: COOPERATIVE
    isolation_column: cooperative_id
    rule: "Wajib menunjuk tepat satu cooperative_id pada user_access_scopes. Tidak dapat membaca atau memodifikasi petani, penerimaan, atau e-DO koperasi lain."
  - scope_type: MILL
    isolation_column: mill_id
    rule: "Wajib menunjuk tepat satu mill_id pada user_access_scopes. Tidak dapat memverifikasi e-DO atau membuat/mengubah tiket milik PKS lain."
  - scope_type: PERUMDA_GLOBAL
    isolation_column: null
    rule: "Akses lintas koperasi/PKS di tingkat Perumda sesuai batas permission peran masing-masing."

# =============================================================================
# 3. SEPARATION OF DUTIES & PUBLIC/PRIVATE BOUNDARIES
# =============================================================================
separation_of_duties:
  - rule_id: SOD-01
    subject: "Harga TBS Multi-PKS"
    rule: "Penginput/pengaju (submitted_by) tidak boleh memverifikasi (verified_by) kutipan harga yang sama."
    applies_to_operations: [verifyOrRejectPrice]
    references: [BSD §4.2, AFD §10.5]
  - rule_id: SOD-02
    subject: "Kontrak Niaga"
    rule: "Pembuat draf kontrak (created_by) tidak boleh menjadi penyetuju akhir aktivasi kontrak (approved_by)."
    applies_to_operations: [approveContract]
    references: [BSD §4.2, BSD BR-CON-003]
  - rule_id: SOD-03
    subject: "Penyelesaian Sengketa Rekonsiliasi"
    rule: "Petugas pemeriksa yang mencatat review awal tidak boleh mengesahkan penyelesaian akhir sengketa seorang diri bila mekanisme dual review aktif."
    applies_to_operations: [resolveReconciliationDispute]
    references: [BSD §18.5, AFD §20.2]
  - rule_id: SOD-04
    subject: "Verifikasi Faktur"
    rule: "Pembuat draf faktur tidak boleh memverifikasi faktur yang sama."
    applies_to_operations: [verifyInvoice]
    references: [BSD §4.2, BR-INV-001]
  - rule_id: SOD-05
    subject: "Persetujuan Pembayaran"
    rule: "Staf keuangan yang mengajukan/mencatat kewajiban pembayaran tidak boleh bertindak sebagai approver pembayaran yang sama (Maker != Checker)."
    applies_to_operations: [approveOrRejectInvoicePayment]
    references: [BSD §4.2, BR-PAY-003]
  - rule_id: SOD-06
    subject: "Verifikasi Bukti Pembayaran"
    rule: "Pencatat bukti bayar (recorded_by) dilarang memverifikasi keabsahan bukti pembayaran yang ia unggah sendiri."
    applies_to_operations: [verifyPaymentRecord]
    references: [BSD §22.3, BR-PAY-009]
  - rule_id: BR-SYS-002
    subject: "Larangan Privilege Approver bagi Administrator Teknis"
    rule: "SYSTEM_ADMIN tidak pernah boleh memegang permission prices.verify, contracts.approve, reconciliations.resolve, invoices.verify, payments.approve, atau payments.verify secara otomatis maupun implisit."
    applies_to_operations: [verifyOrRejectPrice, approveContract, resolveReconciliationDispute, verifyInvoice, approveOrRejectInvoicePayment, verifyPaymentRecord]
    references: [AFD §27.3, D4/D5 BR-SYS-002]

public_private_boundary:
  rules:
    - "Portal Publik (/api/v1/public/*) TIDAK PERNAH mewajibkan login dan TIDAK BOLEH mengembalikan NIK/identity_reference, nomor telepon pribadi petani, data transaksi penerimaan, detail kontrak niaga rahasia, margin Perumda, riwayat pembayaran, atau audit logs (BR-PUB-003)."
    - "Daftar PKS publik hanya mengembalikan baris dengan mills.is_public == true (AFD §9.4)."
    - "Harga publik hanya mengembalikan baris dengan mill_price_quotes.status == 'PUBLISHED' dan periode berlaku aktif (BR-PRC-006, BR-PUB-002); data harga Disbun dipisahkan secara eksplisit dari penawaran PKS (BR-CMP-001)."

# =============================================================================
# 4. PERMISSION DEFINITIONS (UNIQUE CODES)
# =============================================================================
permissions:
  - { code: public.prices.read, module: public_portal, resource: public_prices, action: read, description: "Membaca harga TBS publik terverifikasi dan referensi Disbun." }
  - { code: public.mills.read, module: public_portal, resource: public_mills, action: read, description: "Membaca direktori dan profil PKS publik yang diizinkan tampil." }
  - { code: public.profile.read, module: public_portal, resource: public_profile, action: read, description: "Membaca profil Perumda Agro Niaga, kemitraan, dan pengumuman publik." }
  - { code: auth.session.read, module: identity_access, resource: auth_session, action: read, description: "Membaca profil pengguna dan scope sesi saat ini." }
  - { code: farmers.read, module: master_data, resource: farmers, action: read, description: "Membaca daftar dan detail petani sesuai scope." }
  - { code: farmers.write, module: master_data, resource: farmers, action: write, description: "Membuat dan memperbarui/menonaktifkan data petani dalam scope." }
  - { code: farms.read, module: master_data, resource: farms, action: read, description: "Membaca daftar kebun sesuai scope (koordinat privat dilindungi)." }
  - { code: farms.write, module: master_data, resource: farms, action: write, description: "Membuat dan memperbarui data kebun dalam scope (FLOW-05)." }
  - { code: cooperatives.read, module: master_data, resource: cooperatives, action: read, description: "Membaca data koperasi mitra sesuai scope." }
  - { code: mills.read, module: master_data, resource: mills, action: read, description: "Membaca master data PKS internal." }
  - { code: mills.write, module: master_data, resource: mills, action: write, description: "Membuat/memperbarui data perusahaan PKS, profil, koordinat, & is_public (FLOW-06)." }
  - { code: vehicles.read, module: master_data, resource: vehicles, action: read, description: "Membaca data armada angkutan." }
  - { code: vehicles.write, module: master_data, resource: vehicles, action: write, description: "Menambah data kendaraan angkutan." }
  - { code: drivers.read, module: master_data, resource: drivers, action: read, description: "Membaca daftar sopir operasional." }
  - { code: drivers.write, module: master_data, resource: drivers, action: write, description: "Menambah data sopir operasional." }
  - { code: prices.read, module: pricing, resource: mill_price_quotes, action: read, description: "Membaca daftar internal, draft, dan riwayat harga multi-PKS." }
  - { code: prices.create, module: pricing, resource: mill_price_quotes, action: create, description: "Membuat dan mengedit draft harga PKS maupun input referensi Disbun." }
  - { code: prices.submit, module: pricing, resource: mill_price_quotes, action: submit, description: "Mengajukan draft harga untuk verifikasi checker." }
  - { code: prices.verify, module: pricing, resource: mill_price_quotes, action: verify, description: "Menyetujui atau menolak pengajuan harga (Maker != Checker)." }
  - { code: prices.publish, module: pricing, resource: mill_price_quotes, action: publish, description: "Memublikasikan harga terverifikasi ke Portal Publik." }
  - { code: prices.revoke, module: pricing, resource: mill_price_quotes, action: revoke, description: "Mencabut publikasi harga aktif dengan alasan audit." }
