# Canonical API Error Catalog — AgroNiaga TBS (Perumda Tuah Sekata)
# Authority: TRD V1.1 (§15), BSD V1.1 (§29), AFD V1.1 (§33), DBD V1.1
# Naming Convention (TRD §15.4): MODULE_CATEGORY_DESCRIPTION
# Public messages are in Indonesian, client-safe, and never leak stack traces or internal DB schema details.

version: "1.0.0"
contract_baseline: "M0-V1.1"
error_code_convention: "MODULE_CATEGORY_DESCRIPTION"

envelope_schema:
  description: "Standard ErrorResponse envelope returned across all non-2xx API responses."
  required_fields:
    - success
    - error
    - request_id
  error_object_fields:
    - code
    - message
    - details

errors:
  # =========================================================================
  # 1. AUTHENTICATION (401 / 403 / 429)
  # =========================================================================
  - code: AUTH_INVALID_CREDENTIALS
    http_status: 401
    category: Authentication
    description: "Kredensial username/password tidak valid atau akun tidak lolos autentikasi."
    triggering_condition: "Login gagal karena username tidak ditemukan, password salah, atau akun tidak aktif/terkunci."
    field_details: null
    client_safe_message: "Username atau kata sandi tidak sesuai."
    retryable: true
    required_user_action: "Periksa kembali username serta kata sandi dan coba masuk ulang."
    security_considerations: "Dilarang membocorkan apakah username terdaftar, alasan spesifik (salah password vs akun nonaktif), atau status lock di respons login (AFD §7.3, TRD §12.3)."
    related_operations:
      - loginUser
    references:
      - TRD §12.3
      - TRD §15.4
      - AFD §7.3

  - code: AUTH_REQUIRED
    http_status: 401
    category: Authentication
    description: "Permintaan ke endpoint internal tidak memiliki cookie sesi yang sah."
    triggering_condition: "Cookie sesi ts_agroniaga_session tidak ada atau tidak valid pada endpoint terautentikasi."
    field_details: null
    client_safe_message: "Silakan masuk terlebih dahulu untuk mengakses layanan ini."
    retryable: false
    required_user_action: "Arahkan pengguna ke halaman login (/login)."
    security_considerations: "Fail-closed apabila session store Redis/DB bermasalah (TRD §11.6)."
    related_operations:
      - getCurrentUser
      - listFarmers
      - listReceipts
      - verifyDeliveryOrderQr
    references:
      - TRD §12.2
      - AFD §7.4
      - AFD §33.2

  - code: AUTH_SESSION_EXPIRED
    http_status: 401
    category: Authentication
    description: "Sesi pengguna telah berakhir atau dicabut oleh administrator/logout."
    triggering_condition: "Token sesi di server telah melewati expires_at atau memiliki revoked_at terisi."
    field_details: null
    client_safe_message: "Sesi Anda telah berakhir. Silakan masuk kembali."
    retryable: false
    required_user_action: "Bersihkan cache data privat di browser, login ulang, dan periksa status transaksi sebelum mengirim ulang mutasi."
    security_considerations: "Cookie sesi wajib segera dibersihkan oleh Set-Cookie max-age=0 saat terdeteksi invalid/revoked."
    related_operations:
      - getCurrentUser
      - createReceiptDraft
      - issueDeliveryOrder
    references:
      - AFD §7.6
      - DBD §6.7

  - code: AUTH_CSRF_INVALID
    http_status: 403
    category: Authentication
    description: "Token CSRF tidak ada, kedaluwarsa, atau tidak cocok dengan sesi aktif."
    triggering_condition: "Header X-CSRF-Token pada request mutasi tidak valid terhadap sesi ts_agroniaga_session."
    field_details: null
    client_safe_message: "Permintaan tidak dapat diverifikasi secara aman. Muat ulang halaman lalu coba kembali."
    retryable: true
    required_user_action: "Ambil ulang token melalui GET /api/v1/auth/csrf sebelum mengirim ulang permintaan."
    security_considerations: "Mencegah Cross-Site Request Forgery; tidak mengeksekusi mutasi apa pun saat CSRF gagal (TRD §13.3)."
    related_operations:
      - logoutUser
      - createFarmer
      - issueDeliveryOrder
      - approveOrRejectInvoicePayment
    references:
      - TRD §13.3
      - IPD §11

  - code: AUTH_TOO_MANY_REQUESTS
    http_status: 429
    category: Rate Limiting
    description: "Terlalu banyak percobaan login gagal dalam jendela waktu terbatas."
    triggering_condition: "Melebihi batas rate limiter per IP/akun pada endpoint autentikasi."
    field_details:
      type: object
      properties:
        retry_after_seconds: integer
    client_safe_message: "Terlalu banyak percobaan masuk. Tunggu beberapa saat sebelum mencoba kembali."
    retryable: true
    required_user_action: "Tunggu sesuai header Retry-After sebelum mencoba masuk lagi."
    security_considerations: "Rate limit state bersifat fail-closed pada operasi login (TRD §11.6)."
    related_operations:
      - loginUser
    references:
      - TRD §12.3
      - AFD §7.3

  # =========================================================================
  # 2. AUTHORIZATION & SEPARATION OF DUTIES (403)
  # =========================================================================
  - code: AUTH_ACCESS_DENIED
    http_status: 403
    category: Authorization
    description: "Peran pengguna tidak memiliki permission yang diwajibkan untuk operasi ini."
    triggering_condition: "Pengguna terautentikasi tidak memiliki permission code terkait pada role_permissions."
    field_details:
      type: object
      nullable: true
    client_safe_message: "Anda tidak memiliki izin untuk mengakses atau menjalankan tindakan ini."
    retryable: false
    required_user_action: "Kembali ke beranda peran atau hubungi administrator jika kewenangan memang dibutuhkan."
    security_considerations: "Default deny di server; penyembunyian tombol UI bukan mekanisme keamanan (AFD §7.5, TRD §12.4)."
    related_operations:
      - publishPrice
      - verifyInvoice
      - listUsers
    references:
      - TRD §12.4
      - AFD §7.5
      - BSD §29.1

  - code: AUTH_SCOPE_FORBIDDEN
    http_status: 403
    category: Authorization
    description: "Pengguna mencoba mengakses atau mengubah resource di luar resource scope miliknya."
    triggering_condition: "FARMER membuka transaksi petani lain, COOPERATIVE_OPERATOR mengakses koperasi lain, atau MILL_OPERATOR mengakses tiket/e-DO PKS lain."
    field_details: null
    client_safe_message: "Anda tidak berwenang mengakses data di luar cakupan organisasi Anda."
    retryable: false
    required_user_action: "Pilih data yang termasuk dalam cakupan akun atau PKS Anda."
    security_considerations: "Untuk pencarian ID spesifik lintas scope yang sensitif, backend dapat mengembalikan 403 konsisten atau 404 tanpa membocorkan rincian atribut entitas pihak lain (DBD §33.6, BSD BIZ-023/024)."
    bsd_alias: ACCESS_OUT_OF_SCOPE
    related_operations:
      - getFarmer
      - getReceiptDetail
      - verifyDeliveryOrderQr
      - createMillTicket
    references:
      - DBD §6.6
      - BSD §6.3
      - BSD BIZ-023
      - BSD BIZ-024

  - code: AUTH_OPERATION_FORBIDDEN
    http_status: 403
    category: Authorization
    description: "Operasi terlarang secara kebijakan sistem bagi peran atau status akun tertentu."
    triggering_condition: "Administrator sistem mencoba menyetujui pembayaran atau keputusan bisnis (BR-SYS-002), atau petani mencoba memodifikasi timbangan (BR-MD-004)."
    field_details: null
    client_safe_message: "Peran Anda tidak diperbolehkan melakukan tindakan persetujuan atau perubahan operasional ini."
    retryable: false
    required_user_action: "Teruskan permohonan kepada pejabat operasional/keuangan/Direksi yang berwenang."
    security_considerations: "Menegakkan pemisahan wewenang teknis Administrator dari otorisasi transaksi bisnis (BR-SYS-002, AFD §27.3)."
    related_operations:
      - verifyOrRejectPrice
      - resolveReconciliationDispute
      - approveOrRejectInvoicePayment
      - recordReceiptWeighing
    references:
      - AFD §27.3
      - BSD §4.2
      - D4/D5 BR-SYS-002

  - code: AUTH_CONFLICT_OF_DUTIES
    http_status: 403
    category: Authorization
    description: "Pelanggaran prinsip maker-checker karena aktor pembuat dan pemeriksa/penyetuju adalah orang yang sama."
    triggering_condition: "Actor ID yang melakukan verify/approve sama dengan actor ID pembuat/pengaju pada harga, dispute, faktur, atau pembayaran."
    field_details:
      type: object
      nullable: true
    client_safe_message: "Tindakan pemeriksaan atau persetujuan harus dilakukan oleh petugas berwenang yang berbeda dari pembuat data."
    retryable: false
    required_user_action: "Minta petugas verifikator atau pejabat berwenang lain untuk meninjau dan menyetujui dokumen."
    security_considerations: "Wajib diperiksa pada layer Use Case server; kecuali pengecualian resmi SOP yang diaudit (BSD §4.2)."
    related_operations:
      - verifyOrRejectPrice
      - resolveReconciliationDispute
      - verifyInvoice
      - approveOrRejectInvoicePayment
      - verifyPaymentRecord
    references:
      - BSD §4.2
      - AFD §10.5

  # =========================================================================
  # 3. GENERAL RESOURCE & VALIDATION ERRORS (404 / 422)
  # =========================================================================
  - code: SYS_RESOURCE_NOT_FOUND
    http_status: 404
    category: Validation
    description: "Resource dengan identifier atau nomor referensi yang diminta tidak ditemukan atau tidak tersedia untuk konteks publik/scope."
    triggering_condition: "UUID/ID tidak ada di PostgreSQL atau PKS belum dipublikasikan (is_public=false) pada endpoint publik."
    field_details: null
    client_safe_message: "Data yang diminta tidak ditemukan."
    retryable: false
    required_user_action: "Periksa kembali nomor referensi atau kembali ke halaman daftar."
    security_considerations: "Dilarang mengungkap alasan apakah entitas ada namun berstatus privat pada API publik."
    related_operations:
      - getPublicPriceDetail
      - getPublicMillDetail
      - getReceiptDetail
      - getDeliveryOrderDetail
      - getMillTicketDetail
      - getReconciliationDetail
    references:
      - TRD §15.2
      - BSD §5.1

  - code: VAL_REQUIRED_FIELD
    http_status: 422
    category: Validation
    description: "Satu atau beberapa bidang wajib tidak diisi atau bernilai kosong."
    triggering_condition: "Validasi schema Pydantic menolak field wajib yang kosong/null, seperti alasan koreksi/penolakan."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Data wajib belum lengkap. Periksa bidang yang ditandai."
    retryable: true
    required_user_action: "Lengkapi seluruh kolom bertanda wajib dan kirim kembali formulir."
    security_considerations: "Jangan memantulkan nilai sensitif (password/token) ke dalam response details."
    related_operations:
      - createFarmer
      - createMill
      - resolveReconciliationDispute
      - cancelDeliveryOrder
    references:
      - AFD §33.1
      - BSD BIZ-017

  - code: VAL_INVALID_FORMAT
    http_status: 422
    category: Validation
    description: "Format data tidak sesuai ketentuan (UUID, tanggal ISO, MIME berkas, atau panjang karakter)."
    triggering_condition: "Parameter path/query atau field payload gagal validasi tipe/format."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Format masukan tidak valid. Periksa kembali isian Anda."
    retryable: true
    required_user_action: "Sesuaikan format input sesuai petunjuk kolom."
    security_considerations: "Validasi ketat mencegah payload oversize dan injection."
    related_operations:
      - createFarmer
      - createMill
      - uploadEvidenceMetadata
    references:
      - TRD §13.2
      - TRD §13.6

  - code: VAL_INVALID_DECIMAL_PRECISION
    http_status: 422
    category: Validation
    description: "Angka berat, harga, nominal, luas, atau persentase melanggar format string desimal atau batas positif."
    triggering_condition: "Pengiriman angka negatif pada harga/pembayaran, lebih dari jumlah desimal yang diizinkan, atau format non-desimal (mis. mengirim 'Rp2.850')."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Nilai angka atau presisi desimal tidak valid."
    retryable: true
    required_user_action: "Masukkan angka desimal yang benar (maks. 3 angka di belakang koma untuk kg, 2 untuk rupiah)."
    security_considerations: "Menolak float/simbol mata uang mencegah kegagalan kalkulasi Decimal di server (IPD §4.4, DBD §3.3)."
    related_operations:
      - createPriceDraft
      - recordReceiptWeighing
      - createMillTicket
      - recordPaymentEvidence
    references:
      - IPD §4.4
      - DBD §3.3

  - code: VAL_INVALID_COORDINATES
    http_status: 422
    category: Validation
    description: "Koordinat latitude/longitude di luar rentang geografis atau tidak lengkap berpasangan."
    triggering_condition: "Latitude diisi tanpa Longitude (atau sebaliknya), atau nilai di luar lat [-90..90] / lng [-180..180] (DBD §7.7, FLOW-05/06)."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Koordinat lokasi tidak valid. Latitude (-90 s.d. 90) dan Longitude (-180 s.d. 180) wajib diisi berpasangan."
    retryable: true
    required_user_action: "Isi kedua koordinat dengan benar atau kosongkan keduanya jika titik belum diverifikasi."
    security_considerations: "Menjaga integritas titik peta tanpa menghasilkan koordinat fiktif 0,0 (BR-MD-014)."
    related_operations:
      - createFarm
      - updateFarm
      - createMill
      - updateMill
    references:
      - DBD §7.7
      - BSD BR-MD-014
      - FigCraft D5 FLOW-05/FLOW-06

  - code: VAL_INVALID_DATE_RANGE
    http_status: 422
    category: Validation
    description: "Tanggal akhir mendahului tanggal awal pada filter periode, kontrak, atau masa berlaku harga."
    triggering_condition: "effective_until < effective_from atau end_date < start_date."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Periode tanggal tidak valid. Tanggal akhir tidak boleh mendahului tanggal mulai."
    retryable: true
    required_user_action: "Perbaiki rentang tanggal awal dan akhir lalu ulangi."
    security_considerations: "Standard validation error."
    bsd_alias: PRICE_PERIOD_INVALID
    related_operations:
      - createPriceDraft
      - createContract
      - listInternalPrices
      - getSupplyReport
    references:
      - DBD §18.4
      - BSD §29.1

  # =========================================================================
  # 4. MASTER DATA CONFLICTS (409)
  # =========================================================================
  - code: MD_DUPLICATE_CODE
    http_status: 409
    category: Business Conflicts
    description: "Kode unik entitas master (petani, kebun, koperasi, PKS, plat kendaraan, username) sudah terdaftar."
    triggering_condition: "Unique constraint violation pada farmer_code, farm_code, mill_code, plate_number, atau username."
    field_details:
      type: object
      properties:
        field: string
    client_safe_message: "Kode referensi sudah terdaftar di sistem. Gunakan kode unik yang berbeda."
    retryable: true
    required_user_action: "Periksa daftar data aktif/nonaktif atau masukkan kode unik baru."
    security_considerations: "Terjemahan ramah pengguna; tidak pernah memantulkan IntegrityError SQL mentah (TRD §15.5)."
    related_operations:
      - createFarmer
      - createFarm
      - createMillCompany
      - createMill
      - createVehicle
      - createUser
    references:
      - PRD FR-MD-005
      - DBD §18.3
      - FigCraft D5 FLOW-05/FLOW-06

  - code: MD_ENTITY_IN_USE
    http_status: 409
    category: Business Conflicts
    description: "Data master sudah direferensikan oleh transaksi historis sehingga tidak dapat dihapus permanen."
    triggering_condition: "Permintaan penghapusan fisik pada petani/kebun/PKS yang memiliki riwayat transaksi (BR-MD-003, DBD §18.6)."
    field_details: null
    client_safe_message: "Data tidak dapat dihapus karena telah memiliki riwayat transaksi. Gunakan status Nonaktif."
    retryable: false
    required_user_action: "Ubah status entitas menjadi INACTIVE untuk menonaktifkan tanpa merusak riwayat."
    security_considerations: "Menjaga integritas referensial dan keterlacakan histori."
    related_operations:
      - updateFarmer
      - updateMill
    references:
      - BSD BR-MD-003
      - BSD BR-MD-013
      - DBD §18.6

  - code: MD_STALE_RECORD_VERSION
    http_status: 409
    category: Business Conflicts
    description: "Versi data master sudah diubah petugas lain sebelum penyimpanan."
    triggering_condition: "Optimistic locking version mismatch saat PATCH data master."
    field_details:
      type: object
      properties:
        expected_version: integer
        current_version: integer
    client_safe_message: "Data telah diperbarui oleh pengguna lain. Muat ulang data terbaru sebelum menyimpan."
    retryable: false
    required_user_action: "Muat ulang formulir detail, tinjau perubahan terbaru, lalu simpan kembali."
    security_considerations: "Mencegah silent lost update antarpetugas (AFD §8.6, DBD §21.4)."
    related_operations:
      - updateFarmer
      - updateFarm
      - updateMill
    references:
      - AFD §8.6
      - DBD §30.6

  # =========================================================================
  # 5. PRICING CONFLICTS & VALIDATION (409 / 422)
  # =========================================================================
  - code: PRICE_INVALID_AMOUNT
    http_status: 422
    category: Validation
    description: "Nominal harga TBS per kg bernilai nol atau negatif."
    triggering_condition: "price_per_kg <= 0 (BR-PRC-001)."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Harga TBS harus lebih besar dari nol rupiah per kilogram."
    retryable: true
    required_user_action: "Masukkan nominal harga positif yang sah."
    security_considerations: "Menjaga agar data kosong tidak diwakili harga nol palsu (DBD §8.8)."
    related_operations:
      - createPriceDraft
      - updatePriceDraft
      - createDisbunReferencePrice
    references:
      - BSD BR-PRC-001
      - DBD §8.8

  - code: PRICE_INVALID_PERIOD
    http_status: 422
    category: Validation
    description: "Periode berlaku atau tanggal efektif harga tidak sah."
    triggering_condition: "effective_until <= effective_from atau periode tidak valid untuk publikasi (BSD §29.1)."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Periode berlaku harga tidak sah. Periksa tanggal mulai dan tanggal berakhir."
    retryable: true
    required_user_action: "Perbaiki periode berlaku harga sesuai sumber resmi."
    security_considerations: "Standard domain validation."
    bsd_alias: PRICE_PERIOD_INVALID
    related_operations:
      - createPriceDraft
      - updatePriceDraft
      - publishPrice
    references:
      - BSD BR-PRC-004
      - BSD §29.1
      - TRD §15.4

  - code: PRICE_NOT_VERIFIED
    http_status: 409
    category: Business Conflicts
    description: "Harga belum berstatus VERIFIED sehingga dilarang dipublikasikan ke Portal Publik."
    triggering_condition: "Memanggil POST /prices/{id}/publish pada harga DRAFT, PENDING_VERIFICATION, atau REJECTED."
    field_details:
      type: object
      properties:
        current_status: string
    client_safe_message: "Harga belum diverifikasi sehingga belum dapat dipublikasikan."
    retryable: false
    required_user_action: "Ajukan dan selesaikan verifikasi harga terlebih dahulu oleh verifikator yang berbeda."
    security_considerations: "Menegakkan BR-PRC-006 dan mencegah publikasi harga mentah."
    bsd_alias: PRICE_NOT_VERIFIED
    related_operations:
      - publishPrice
    references:
      - BSD BR-PRC-006
      - BSD BIZ-001
      - IPD §4.3

  - code: PRICE_ALREADY_PUBLISHED
    http_status: 409
    category: Business Conflicts
    description: "Harga sudah berstatus PUBLISHED atau sedang berlaku aktif untuk kategori/PKS yang sama."
    triggering_condition: "Permintaan publish ulang atau edit draft atas harga yang telah dipublikasikan."
    field_details: null
    client_safe_message: "Harga ini sudah dipublikasikan dan tidak dapat diubah langsung."
    retryable: false
    required_user_action: "Buat usulan harga baru untuk periode berikutnya atau cabut publikasi aktif bila perlu koreksi."
    security_considerations: "Menjaga riwayat harga historis tidak tertimpa (BR-PRC-010/012)."
    related_operations:
      - updatePriceDraft
      - publishPrice
    references:
      - TRD §15.4
      - DBD §8.5

  - code: PRICE_OVERLAPPING_PERIOD
    http_status: 409
    category: Business Conflicts
    description: "Terjadi tumpang tindih periode harga aktif pada PKS dan kategori harga yang sama."
    triggering_condition: "Dua kutipan harga PUBLISHED bertabrakan rentang effective_from..effective_until untuk (mill_id, price_category_id)."
    field_details:
      type: object
      properties:
        conflicting_price_quote_id: string
    client_safe_message: "Periode berlaku harga bertumpang tindih dengan harga aktif yang sudah dipublikasikan pada kategori PKS ini."
    retryable: false
    required_user_action: "Sesuaikan periode berlaku atau cabut (revoke) publikasi harga sebelumnya sesuai SOP."
    security_considerations: "Menghindari ambiguitas harga ganda pada Portal Publik (AFD §10.8, DBD §8.5)."
    related_operations:
      - publishPrice
    references:
      - AFD §10.8
      - DBD §8.5

  - code: PRICE_INVALID_STATE_TRANSITION
    http_status: 409
    category: Business Conflicts
    description: "Perubahan status harga melompati alur state machine SM-01."
    triggering_condition: "Aksi submit/verify/publish/revoke dipanggil dari status awal yang tidak diizinkan."
    field_details:
      type: object
      properties:
        current_status: string
        requested_action: string
    client_safe_message: "Status harga saat ini tidak mengizinkan tindakan tersebut."
    retryable: false
    required_user_action: "Muat ulang detail harga untuk melihat status terkini dan langkah berikutnya yang tersedia."
    security_considerations: "State validation dilakukan di Use Case/Domain."
    related_operations:
      - submitPriceForVerification
      - verifyOrRejectPrice
      - publishPrice
      - revokePrice
    references:
      - AFD §29
      - BSD §26.2

  # =========================================================================
  # 6. TBS RECEIVING & GRADING (409 / 422)
  # =========================================================================
  - code: TBS_INVALID_WEIGHT
    http_status: 422
    category: Validation
    description: "Berat bruto atau tara bernilai negatif, nol tidak wajar, melebihi kapasitas, atau tara melebihi bruto."
    triggering_condition: "gross_weight_kg < 0, tare_weight_kg < 0, atau tare_weight_kg > gross_weight_kg (BR-008/009, BIZ-004)."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Nilai timbangan tidak valid: berat tara tidak boleh melebihi berat bruto dan tidak boleh bernilai negatif."
    retryable: true
    required_user_action: "Periksa ulang hasil timbangan jembatan/ramp dan masukkan angka bruto serta tara yang benar."
    security_considerations: "Validasi juga ditegakkan sebagai PostgreSQL CHECK constraint (DBD §19.1)."
    bsd_alias: INVALID_WEIGHT
    related_operations:
      - recordReceiptWeighing
      - createMillTicket
      - reviseMillTicket
    references:
      - TRD §15.4
      - BSD BIZ-004
      - DBD §19.1

  - code: TBS_INVALID_GRADING_DEDUCTION
    http_status: 422
    category: Validation
