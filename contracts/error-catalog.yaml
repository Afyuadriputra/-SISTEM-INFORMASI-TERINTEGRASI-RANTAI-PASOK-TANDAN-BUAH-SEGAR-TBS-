    triggering_condition: "reason kosong/terlalu pendek pada POST /reconciliations/{id}/review atau /resolve (BR-DSP-002, BIZ-017)."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Alasan pemeriksaan dan keputusan penyelesaian sengketa wajib diisi."
    retryable: true
    required_user_action: "Lengkapi alasan klarifikasi dan referensi bukti pendukung sebelum mengirim."
    security_considerations: "Wajib terekam di dispute_reviews & audit_events."
    related_operations:
      - submitDisputeReview
      - resolveReconciliationDispute
    references:
      - BSD BR-DSP-002
      - BSD BIZ-017

  - code: REC_INVALID_STATE_TRANSITION
    http_status: 409
    category: Business Conflicts
    description: "Transisi status rekonsiliasi atau dispute melanggar aturan SM-07/SM-08."
    triggering_condition: "Mencoba resolve dari status MATCHED/WAITING_TICKET atau menghitung ulang kasus RESOLVED/CANCELLED."
    field_details:
      type: object
      properties:
        current_status: string
    client_safe_message: "Status rekonsiliasi saat ini tidak mengizinkan tindakan tersebut."
    retryable: false
    required_user_action: "Periksa status terbaru kasus rekonsiliasi."
    security_considerations: "Status rekonsiliasi final dilindungi riwayat versi."
    related_operations:
      - calculateReconciliation
      - submitDisputeReview
      - resolveReconciliationDispute
    references:
      - AFD §30
      - BSD §17.8

  - code: REC_ALLOCATION_IMBALANCE
    http_status: 422
    category: Validation
    description: "Total berat atau nilai alokasi multi-petani tidak seimbang dengan dasar penyelesaian e-DO."
    triggering_condition: "Sum(farmer_settlement_allocations) != target total after rounding rule (BR-ALC-002/003, BIZ-019)."
    field_details:
      type: object
      properties:
        expected_total: string
        allocated_total: string
    client_safe_message: "Jumlah pembagian alokasi petani tidak seimbang dengan total nilai transaksi yang disahkan."
    retryable: false
    required_user_action: "Periksa bobot asal dan aturan pembulatan yang dipilih."
    security_considerations: "Mencegah kebocoran atau selisih tak terlacak."
    related_operations:
      - simulateOrComputeFarmerAllocations
    references:
      - BSD BR-ALC-002
      - BSD BR-ALC-003
      - BSD BIZ-019

  - code: REC_ALLOCATION_POLICY_UNCONFIRMED
    http_status: 409
    category: Business Conflicts
    description: "Mode alokasi final ke petani ditolak karena kebijakan pembagian hasil multi-petani belum disahkan SOP Perumda."
    triggering_condition: "Permintaan finalisasi alokasi nyata ketika allocation_policy_version_id belum berstatus APPROVED (BSD-DEC-013)."
    field_details:
      type: object
      properties:
        pending_decision_id: string
    client_safe_message: "Pembagian hasil final belum dapat disahkan sebelum SOP metode alokasi multi-petani ditetapkan secara resmi."
    retryable: false
    required_user_action: "Gunakan mode simulasi berlabel atau tunggu pengesahan SOP alokasi hasil."
    security_considerations: "Menegakkan larangan konversi aturan simulasi menjadi keputusan finansial nyata (BSD §20.7)."
    related_operations:
      - simulateOrComputeFarmerAllocations
    references:
      - BSD §20.7
      - AFD §41 #4

  # =========================================================================
  # 11. FINANCE, INVOICES & PAYMENTS (409 / 422)
  # =========================================================================
  - code: FIN_INVOICE_NOT_VERIFIED
    http_status: 409
    category: Business Conflicts
    description: "Faktur belum berstatus VERIFIED/ISSUED sehingga tidak dapat diterbitkan atau dibayarkan."
    triggering_condition: "Penerbitan faktur DRAFT, atau persetujuan pembayaran atas faktur non-ISSUED (BR-INV-001)."
    field_details:
      type: object
      properties:
        invoice_status: string
    client_safe_message: "Faktur belum terverifikasi atau diterbitkan sehingga proses lanjutan belum dapat dijalankan."
    retryable: false
    required_user_action: "Selesaikan verifikasi dan penerbitan faktur terlebih dahulu."
    security_considerations: "Memastikan keabsahan dokumen tagihan."
    bsd_alias: INVOICE_NOT_VERIFIED
    related_operations:
      - issueInvoice
      - approveOrRejectInvoicePayment
      - recordPaymentEvidence
    references:
      - BSD BR-INV-001
      - BSD §29.1

  - code: FIN_DISPUTE_HOLD_BLOCKED
    http_status: 409
    category: Business Conflicts
    description: "Transaksi masih berada dalam status DISPUTE_HOLD atau UNDER_REVIEW sehingga diblokir dari faktur/pembayaran final."
    triggering_condition: "reconciliation_cases.status NOT IN ('MATCHED', 'RESOLVED') saat pembuatan faktur/pembayaran (BR-PAY-005, BIZ-016)."
    field_details:
      type: object
      properties:
        reconciliation_status: string
    client_safe_message: "Transaksi masih dalam pemeriksaan sengketa sehingga faktur atau pembayaran final ditahan."
    retryable: false
    required_user_action: "Selesaikan kasus sengketa di modul Rekonsiliasi terlebih dahulu."
    security_considerations: "Menjamin tidak ada pencairan melewati dispute (AC-014, BIZ-016)."
    related_operations:
      - createInvoiceDraft
      - issueInvoice
      - approveOrRejectInvoicePayment
    references:
      - BSD BR-PAY-005
      - BSD BIZ-016

  - code: FIN_POLICY_UNCONFIRMED
    http_status: 409
    category: Business Conflicts
    description: "Finalisasi faktur atau transaksi pembayaran nyata ditahan karena model usaha transaksi masih UNCONFIRMED."
    triggering_condition: "business_model_code == 'UNCONFIRMED' pada saat issue invoice atau approval pembayaran nyata (DBD §10.1, BSD-DEC-001)."
    field_details:
      type: object
      properties:
        business_model_code: string
        pending_decision_id: string
    client_safe_message: "Finalisasi keuangan ditahan karena klasifikasi model usaha kontrak (Principal/Agent) belum disahkan."
    retryable: false
    required_user_action: "Sahkan klasifikasi model usaha transaksi sesuai SOP sebelum menerbitkan kewajiban keuangan nyata."
    security_considerations: "Menegakkan pengaman principal/agent agar nilai principal tidak salah diakui sebagai pendapatan agen (BSD §2.3, §23.3)."
    related_operations:
      - issueInvoice
      - approveOrRejectInvoicePayment
      - recordPaymentEvidence
    references:
      - DBD §10.1
      - BSD-DEC-001

  - code: PAY_APPROVAL_REQUIRED
    http_status: 409
    category: Business Conflicts
    description: "Pembayaran keluar belum memiliki persetujuan pejabat berwenang sehingga bukti bayar ditolak."
    triggering_condition: "Mencatat OUTBOUND payment pada invoice yang belum memiliki status payment approval APPROVED (BIZ-020)."
    field_details: null
    client_safe_message: "Pembayaran belum disetujui pejabat berwenang sehingga pencatatan pembayaran belum dapat diproses."
    retryable: false
    required_user_action: "Ajukan dan tunggu persetujuan pembayaran sesuai matriks otorisasi."
    security_considerations: "Menegakkan otorisasi sebelum pencatatan pengeluaran."
    bsd_alias: PAYMENT_NOT_AUTHORIZED
    related_operations:
      - recordPaymentEvidence
    references:
      - BSD BR-PAY-003
      - BSD BIZ-020

  - code: PAY_ALREADY_APPROVED
    http_status: 409
    category: Business Conflicts
    description: "Persetujuan pembayaran untuk faktur ini sudah disahkan sebelumnya."
    triggering_condition: "Duplicate approval attempt setelah keputusan APPROVED/REJECTED selesai (TRD §15.4)."
    field_details: null
    client_safe_message: "Permintaan persetujuan pembayaran untuk faktur ini sudah diputuskan sebelumnya."
    retryable: false
    required_user_action: "Muat ulang detail faktur untuk melihat keputusan persetujuan terkini."
    security_considerations: "Mencegah persetujuan ganda yang bersaing."
    related_operations:
      - approveOrRejectInvoicePayment
    references:
      - TRD §15.4
      - BSD BR-PAY-011

  - code: PAY_DUPLICATE_PAYMENT
    http_status: 409
    category: Business Conflicts
    description: "Nomor pembayaran atau referensi pembayaran sudah tercatat, atau faktur sudah lunas (PAID)."
    triggering_condition: "Duplikasi payment_number/payment_reference atau mencoba mencatat pembayaran ke faktur yang telah PAID (BR-PAY-011, BIZ-022)."
    field_details: null
    client_safe_message: "Referensi pembayaran sudah pernah tercatat atau kewajiban faktur sudah lunas."
    retryable: false
    required_user_action: "Periksa daftar catatan pembayaran pada faktur terkait."
    security_considerations: "Mencegah pencatatan pembayaran ganda (BR-022, NFR-017)."
    bsd_alias: PAYMENT_DUPLICATE
    related_operations:
      - recordPaymentEvidence
    references:
      - BSD BR-PAY-011
      - BSD §29.1

  - code: PAY_PARTIAL_NOT_SUPPORTED
    http_status: 422
    category: Business Conflicts
    description: "Pembayaran sebagian/termin ditolak secara eksplisit pada baseline MVP."
    triggering_condition: "amount != invoice.total_amount ketika fitur pembayaran parsial masih belum disahkan SOP (BSD §22.5, AFD §22.7)."
    field_details:
      type: object
      properties:
        invoice_total_amount: string
        submitted_amount: string
    client_safe_message: "Pembayaran sebagian belum didukung pada kebijakan sistem saat ini. Masukkan nominal pelunasan penuh sesuai nilai faktur."
    retryable: true
    required_user_action: "Sesuaikan nominal pembayaran agar sama persis dengan total tagihan faktur."
    security_considerations: "Mencegah saldo parsial yang belum memiliki aturan pelunasan bertahap (BSD-DEC-017)."
    related_operations:
      - recordPaymentEvidence
    references:
      - BSD §22.5
      - DBD §14.6

  - code: PAY_AMOUNT_EXCEEDS_INVOICE
    http_status: 422
    category: Validation
    description: "Nominal pembayaran melebihi nilai total kewajiban pada faktur."
    triggering_condition: "amount > invoice.total_amount atau amount <= 0 (BR-PAY-007, DBD §14.6)."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Nominal pembayaran harus positif dan tidak boleh melebihi total tagihan faktur."
    retryable: true
    required_user_action: "Periksa ulang nominal pembayaran pada bukti transaksi."
    security_considerations: "Mencegah kelebihan pembayaran."
    related_operations:
      - recordPaymentEvidence
    references:
      - BSD BR-PAY-007
      - DBD §14.6

  - code: PAY_PROOF_REQUIRED
    http_status: 422
    category: Validation
    description: "Verifikasi pembayaran ditolak karena referensi atau berkas bukti pembayaran tidak tersedia."
    triggering_condition: "Mencoba VERIFY payment record tanpa proof_file_id maupun payment_reference yang lengkap (BR-PAY-009, BR-PAY-010)."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Bukti dan referensi pembayaran yang sah wajib tersedia sebelum verifikasi pelunasan."
    retryable: true
    required_user_action: "Unggah bukti transfer/pembayaran dan lengkapi nomor referensi terlebih dahulu."
    security_considerations: "Menjamin tidak ada status PAID tanpa bukti sah (BIZ-021)."
    related_operations:
      - recordPaymentEvidence
      - verifyPaymentRecord
    references:
      - BSD BR-PAY-009
      - BSD BR-PAY-010
      - BSD BIZ-021

  - code: PAY_INVALID_PARTY_PAIRING
    http_status: 422
    category: Validation
    description: "Arah pembayaran (INBOUND/OUTBOUND) tidak cocok dengan peran pihak creditor/debtor pada faktur."
    triggering_condition: "Ketidakcocokan arah dana terhadap relasi Perumda pada invoices (DBD §14.5)."
    field_details:
      type: array
      items: ValidationErrorDetail
    client_safe_message: "Arah pembayaran dan identitas pihak pembayar/penerima tidak sesuai dengan dokumen faktur terkait."
    retryable: true
    required_user_action: "Pastikan tipe faktur (AR vs AP) selaras dengan pihak pembayar dan penerima."
    security_considerations: "Menjaga integritas pemisahan arus dana PKS->Perumda vs Perumda->Mitra (BR-PAY-008)."
    related_operations:
      - recordPaymentEvidence
    references:
      - DBD §14.5
      - BSD BR-PAY-008

  - code: PAY_INVALID_STATE_TRANSITION
    http_status: 409
    category: Business Conflicts
    description: "Perubahan status catatan pembayaran melanggar alur SM-11."
    triggering_condition: "Mencoba memverifikasi pembayaran yang sudah REJECTED/REVERSED/VERIFIED."
    field_details:
      type: object
      properties:
        current_status: string
    client_safe_message: "Status catatan pembayaran saat ini tidak dapat diproses ulang dengan tindakan tersebut."
    retryable: false
    required_user_action: "Muat ulang daftar pembayaran untuk memeriksa status terkini."
    security_considerations: "Koreksi pembayaran terverifikasi harus menggunakan reversal, bukan hapus fisik (BSD §22.6)."
    related_operations:
      - verifyPaymentRecord
    references:
      - DBD §14.5
      - BSD §22.6

  # =========================================================================
  # 12. AVAILABILITY, RATE LIMIT & INTERNAL SYSTEM ERRORS (429 / 500 / 503 / 504)
  # =========================================================================
  - code: SYS_RATE_LIMIT_EXCEEDED
    http_status: 429
    category: Rate Limiting
    description: "Permintaan melampaui batas laju yang ditetapkan middleware rate limiting."
    triggering_condition: "Frekuensi panggilan API melampaui kuota per menit klien/pengguna."
    field_details:
      type: object
      properties:
        retry_after_seconds: integer
    client_safe_message: "Permintaan terlalu cepat. Tunggu sejenak sebelum mencoba lagi."
    retryable: true
    required_user_action: "Kurangi frekuensi permintaan dan coba kembali sesuai Retry-After."
    security_considerations: "Melindungi endpoint publik maupun privat dari penyalahgunaan (TRD §13.2)."
    related_operations:
      - listPublicPrices
      - listPublicMills
      - listAuditEvents
    references:
      - TRD §13.2

  - code: SYS_DEPENDENCY_UNAVAILABLE
    http_status: 503
    category: Availability
    description: "Dependensi kritikal (PostgreSQL atau penyimpanan sesi wajib) sedang tidak tersedia atau gagal kesiapan."
    triggering_condition: "PostgreSQL down saat operasi tulis/baca wajib atau Redis gagal pada layanan autentikasi fail-closed (TRD §11.6, §25.1)."
    field_details: null
    client_safe_message: "Layanan sistem sedang mengalami gangguan sementara. Silakan coba lagi beberapa saat atau laporkan kode referensi."
    retryable: true
    required_user_action: "Tunggu beberapa saat lalu gunakan tombol Coba Lagi; sertakan request_id jika melaporkan kendala."
    security_considerations: "Kegagalan security store wajib menolak akses fail-closed; tidak menampilkan host/port/password DB."
    related_operations:
      - getReadinessHealth
      - getCurrentUser
      - issueDeliveryOrder
    references:
      - TRD §11.6
      - TRD §15.4
      - TRD §25.1

  - code: SYS_REQUEST_TIMEOUT
    http_status: 504
    category: Availability
    description: "Waktu eksekusi operasi atau dependensi eksternal melampaui batas timeout server."
    triggering_condition: "Query atau pemrosesan melampaui request timeout yang dikonfigurasi (TRD §9.1)."
    field_details: null
    client_safe_message: "Permintaan membutuhkan waktu terlalu lama. Periksa status transaksi sebelum mencoba mengirim ulang."
    retryable: true
    required_user_action: "Periksa apakah transaksi sebelumnya sudah tercatat (untuk operasi mutasi) sebelum mengulang dengan Idempotency-Key yang tepat."
    security_considerations: "Untuk operasi mutasi, klien wajib memeriksa status transaksi terlebih dahulu sebelum retry (AFD §33.6)."
    related_operations:
      - getSupplyReport
      - calculateReconciliation
    references:
      - TRD §9.1
      - AFD §33.6

  - code: SYS_INTERNAL_ERROR
    http_status: 500
    category: Internal Error
    description: "Kesalahan internal tak terduga yang ditangkap global exception handler."
    triggering_condition: "Unhandled exception pada layer aplikasi/infrastruktur."
    field_details: null
    client_safe_message: "Terjadi kendala pada sistem. Silakan coba kembali atau hubungi administrator dengan kode referensi yang ditampilkan."
    retryable: false
    required_user_action: "Laporkan request_id ke administrator untuk ditelusuri lewat CCTV Digital (AFD §33.5)."
    security_considerations: "Stack trace hanya ditulis ke structured error log internal, tidak pernah dikirim dalam respons HTTP (TRD §14.5, §15.1)."
    related_operations: []
    references:
      - TRD §14.5
      - AFD §33.5
