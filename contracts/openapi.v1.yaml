openapi: "3.1.0"
info:
  title: "AgroNiaga TBS Supply Chain API — Perumda Tuah Sekata"
  version: "1.0.0"
  summary: "Canonical Contract-First REST API (M0 Baseline V1.1) untuk Portal Publik & Portal Internal Unit Agro Niaga."
  description: |
    Kontrak kanonis Milestone M0 yang menggabungkan kebutuhan PRD V1.1, TRD V1.1, AFD V1.1,
    DBD V1.1, BSD V1.1, IPD V1.1, dan FigCraft D5 Sign-Off.

    Kebijakan Penting:
    - Seluruh berat (`NUMERIC(14,3)`), harga (`NUMERIC(18,2)`), nominal uang (`NUMERIC(20,2)`), dan persentase (`NUMERIC(9,4)`) dikirim sebagai string desimal tanpa simbol mata uang (`ADR-009`).
    - Autentikasi Portal Internal menggunakan server-side session cookie (`ts_agroniaga_session`, HttpOnly) dan header `X-CSRF-Token` untuk mutasi (`ADR-005`).
    - Endpoint publik `/api/v1/public/*` tidak memerlukan login dan dilarang mengekspos data privat (`BR-PUB-003`).
    - Aturan bisnis yang belum disahkan Perumda ditandai eksplisit (`SIMULATION_ONLY` / `PENDING_SOP` / `FUTURE`) dan transaksi keuangan nyata ditahan bila `business_model_code == "UNCONFIRMED"`.
  contact:
    name: "Unit Agro Niaga — Architecture & Shared Contracts Track"
x-contract-baseline: "M0-V1.1"
x-source-documents:
  - "PRD V1.1"
  - "TRD V1.1"
  - "AFD V1.1"
  - "DBD V1.1"
  - "BSD V1.1"
  - "IPD V1.1"
  - "FigCraft D5 READY"

servers:
  - url: "http://localhost:8000"
    description: "Local FastAPI / Mock development server"
  - url: "/"
    description: "Relative same-origin base path (Reverse proxy / MSW browser harness)"

tags:
  - name: "Infrastructure"
    description: "Liveness dan readiness probes (`/health/live`, `/health/ready`, TRD §25.1)."
  - name: "Public Portal"
    description: "Endpoint anonim tanpa login untuk beranda, harga TBS PKS, Disbun, lokasi PKS, profil Perumda, kemitraan, dan pengumuman (`FLOW-01..03`)."
  - name: "Authentication"
    description: "Sesi server-side cookie, CSRF token, login/logout, dan profil pengguna aktif (`FLOW-04`)."
  - name: "Master Data"
    description: "Manajemen petani, kebun (`FLOW-05`), koperasi, perusahaan PKS, pabrik PKS (`FLOW-06`), armada, dan sopir."
  - name: "Pricing"
    description: "Input, pengajuan verifikasi, verifikasi maker-checker, publikasi, pencabutan harga PKS, serta referensi Disbun (`FLOW-07`)."
  - name: "TBS Receiving"
    description: "Penerimaan TBS petani di koperasi, timbang bruto-tara-netto terversi, dan potongan mutu terpisah (`FLOW-08`, `FLOW-09`)."
  - name: "Contracts & Quota"
    description: "Kontrak niaga PKS, klasifikasi model bisnis, periode kuota, dan reservasi kuota (`FLOW-10`, `FLOW-11`)."
  - name: "Logistics & e-DO"
    description: "Konsolidasi muatan multi-petani, penerbitan e-DO idempoten + QR hash, status pengiriman, dan verifikasi kedatangan PKS (`FLOW-12..14`)."
  - name: "Mill Weighing"
    description: "Tiket timbang PKS unik, grading pabrik, dan revisi berversi (`FLOW-15`)."
  - name: "Reconciliation & Dispute"
    description: "Pencocokan berat asal vs PKS, deteksi selisih negatif, dispute review, penyelesaian, dan simulasi alokasi multi-petani (`FLOW-16..18`)."
  - name: "Finance & Payments"
    description: "Faktur AR/AP terpisah, persetujuan kewajiban pembayaran, pencatatan bukti bayar, dan verifikasi pelunasan (`FLOW-19`)."
  - name: "Files"
    description: "Unggah metadata berkas bukti harga, tiket timbang, dispute, dan bukti transfer secara terotorisasi (`TRD §13.6`)."
  - name: "Reporting"
    description: "Dashboard ringkasan lintas peran dan laporan pasokan, rekonsiliasi, serta keuangan (`FLOW-20..23`)."
  - name: "Administration & Audit"
    description: "Manajemen user/RBAC/scope, versi aturan konfigurasi, audit trail bisnis append-only, dan CCTV Digital kesehatan teknis (`FLOW-24`)."

components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: ts_agroniaga_session
      description: "Server-side random session token cookie (`HttpOnly`, `Secure` pada HTTPS, `SameSite=Lax`). Tidak pernah disimpan di localStorage."
    CsrfTokenHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "CSRF token yang diperoleh dari `GET /api/v1/auth/csrf` dan wajib dikirim pada mutasi terautentikasi."

  headers:
    X-Request-ID:
      description: "Identifier unik korelasi request lintas access log, structured error log, dan business audit (`TRD §14.2`)."
      required: true
      schema:
        $ref: "#/components/schemas/RequestId"
    Retry-After:
      description: "Jumlah detik tunggu sebelum mencoba permintaan ulang saat terkena rate limit (`429`)."
      schema:
        type: integer
        minimum: 1

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: "Kunci idempotensi unik klien untuk mencegah transaksi ganda akibat retry/klik berulang (`ADR-010`, `BR-IDM-001..005`)."
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{8,128}$"
      example: "idm-20261110-edo-042-a1b2c3"
    PageParam:
      name: page
      in: query
      required: false
      description: "Nomor halaman (mulai dari 1)."
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      description: "Jumlah baris per halaman (maksimum 100)."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortDirParam:
      name: sort_dir
      in: query
      required: false
      description: "Arah pengurutan."
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    SearchQueryParam:
      name: q
      in: query
      required: false
      description: "Kata kunci pencarian aman sesuai konteks modul."
      schema:
        type: string
        maxLength: 120
    DateFromParam:
      name: date_from
      in: query
      required: false
      description: "Batas awal tanggal filter inklusif (ISO 8601 `YYYY-MM-DD`)."
      schema:
        $ref: "#/components/schemas/IsoDate"
    DateToParam:
      name: date_to
      in: query
      required: false
      description: "Batas akhir tanggal filter inklusif (ISO 8601 `YYYY-MM-DD`)."
      schema:
        $ref: "#/components/schemas/IsoDate"
    PriceQuoteIdPath:
      name: price_quote_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    MillIdPath:
      name: mill_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    FarmerIdPath:
      name: farmer_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    FarmIdPath:
      name: farm_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ReceiptIdPath:
      name: receipt_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ContractIdPath:
      name: contract_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    DeliveryOrderIdPath:
      name: delivery_order_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    MillTicketIdPath:
      name: ticket_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ReconciliationIdPath:
      name: reconciliation_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    InvoiceIdPath:
      name: invoice_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    PaymentObligationIdPath:
      name: id
      in: path
      required: true
      description: "UUID kewajiban faktur (`invoices.id`) yang diajukan untuk persetujuan pembayaran (`IPD §7.1`)."
      schema: { $ref: "#/components/schemas/Uuid" }
    PaymentIdPath:
      name: payment_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    FileIdPath:
      name: file_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }

  responses:
    UnauthorizedResponse:
      description: "Autentikasi tidak ada, tidak valid, atau sesi kedaluwarsa (`401`)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error:
              code: AUTH_REQUIRED
              message: "Silakan masuk terlebih dahulu untuk mengakses layanan ini."
              details: null
            request_id: "req_1110auth401"
    ForbiddenResponse:
      description: "Dilarang karena role, scope organisasi, CSRF invalid, atau Maker == Checker (`403`)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error:
              code: AUTH_SCOPE_FORBIDDEN
              message: "Anda tidak berwenang mengakses data di luar cakupan organisasi Anda."
              details: null
            request_id: "req_1110auth403"
    NotFoundResponse:
      description: "Data tidak ditemukan atau disembunyikan dari publik/scope (`404`)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error:
              code: SYS_RESOURCE_NOT_FOUND
              message: "Data yang diminta tidak ditemukan."
              details: null
            request_id: "req_1110nf404"
    ConflictResponse:
      description: "Konflik aturan bisnis, status, duplikasi, kunci idempotensi, atau versi data (`409`)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error:
              code: LOG_DELIVERY_ALREADY_ASSIGNED
              message: "Sebagian muatan penerimaan sudah dialokasikan ke e-DO aktif lain dan tidak dapat dikirim ganda."
              details:
                conflicting_receipt_ids: ["00000000-0000-4000-8000-000000000501"]
            request_id: "req_1110conf409"
    ValidationErrorResponse:
      description: "Input tidak valid terhadap skema atau aturan validasi domain (`422`)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error:
              code: TBS_INVALID_WEIGHT
              message: "Nilai timbangan tidak valid: berat tara tidak boleh melebihi berat bruto dan tidak boleh bernilai negatif."
              details:
                - field: "tare_weight_kg"
                  reason: "Berat tara (10500.000) melebihi berat bruto (10250.000)."
                  code: "TBS_INVALID_WEIGHT"
            request_id: "req_1110val422"
    RateLimitResponse:
      description: "Melebihi batas laju permintaan (`429`)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error:
              code: AUTH_TOO_MANY_REQUESTS
              message: "Terlalu banyak percobaan masuk. Tunggu beberapa saat sebelum mencoba kembali."
              details: { retry_after_seconds: 60 }
            request_id: "req_1110rl429"
    ServiceUnavailableResponse:
      description: "Dependensi kritikal (PostgreSQL atau penyimpanan sesi wajib) terganggu (`503`)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            success: false
            error:
              code: SYS_DEPENDENCY_UNAVAILABLE
              message: "Layanan sistem sedang mengalami gangguan sementara. Silakan coba lagi beberapa saat atau laporkan kode referensi."
              details: null
            request_id: "req_8f2a1c90"

  schemas:
    # -------------------------------------------------------------------------
    # Primitives & Reusable Contract Components (§9.3 - §9.8)
    # -------------------------------------------------------------------------
    Uuid:
      type: string
      format: uuid
      example: "10000000-0000-4000-8000-000000000001"
    NullableUuid:
      type: ["string", "null"]
      format: uuid
    UtcTimestamp:
      type: string
      format: date-time
      example: "2026-11-10T01:30:00Z"
    NullableUtcTimestamp:
      type: ["string", "null"]
      format: date-time
    IsoDate:
      type: string
      format: date
      example: "2026-11-10"
    NullableIsoDate:
      type: ["string", "null"]
      format: date
    RequestId:
      type: string
      minLength: 6
      maxLength: 80
      pattern: "^req_[A-Za-z0-9._-]+$"
      example: "req_example_001"
    DecimalKgString:
      type: string
      description: "Berat dalam kg (`NUMERIC(14,3)`), bertanda untuk selisih."
      pattern: "^-?\\d{1,11}\\.\\d{3}$"
      example: "9900.000"
    NonNegativeDecimalKgString:
      type: string
      description: "Berat non-negatif dalam kg (`NUMERIC(14,3)`)."
      pattern: "^\\d{1,11}\\.\\d{3}$"
      example: "10250.000"
    DecimalPriceString:
      type: string
      description: "Harga per kg dalam IDR tanpa simbol Rp (`NUMERIC(18,2)`)."
      pattern: "^\\d{1,16}\\.\\d{2}$"
      example: "2920.00"
    DecimalMoneyString:
      type: string
      description: "Nominal uang IDR tanpa simbol Rp (`NUMERIC(20,2)`)."
      pattern: "^-?\\d{1,18}\\.\\d{2}$"
      example: "28908000.00"
    DecimalPercentString:
      type: string
      description: "Persentase presisi (`NUMERIC(9,4)`)."
      pattern: "^-?\\d{1,5}\\.\\d{4}$"
      example: "1.5000"
    DecimalAreaString:
      type: string
      description: "Luas kebun dalam hektar (`NUMERIC(12,4)`)."
      pattern: "^\\d{1,8}\\.\\d{4}$"
      example: "2.5000"
    NullableLatitudeString:
      type: ["string", "null"]
      pattern: "^-?(?:90(?:\\.0{1,6})?|(?:[1-8]?\\d)(?:\\.\\d{1,6})?)$"
      example: "0.402100"
    NullableLongitudeString:
      type: ["string", "null"]
      pattern: "^-?(?:180(?:\\.0{1,6})?|(?:1[0-7]\\d|[1-9]?\\d)(?:\\.\\d{1,6})?)$"
      example: "101.860400"
    NullableString:
      type: ["string", "null"]

    PolicyClassification:
      type: string
      enum: [CONFIRMED, SIMULATION_ONLY, PENDING_SOP, FUTURE]
    RoleCode:
      type: string
      enum: [FARMER, COOPERATIVE_OPERATOR, PERUMDA_OPERATIONS, PERUMDA_FINANCE, MILL_OPERATOR, DIRECTOR, SYSTEM_ADMIN]
    ScopeType:
      type: string
      enum: [FARMER, COOPERATIVE, MILL, PERUMDA_GLOBAL]
    EntityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, LOCKED]
    BusinessModelCode:
      type: string
      enum: [PRINCIPAL, AGENT, UNCONFIRMED]
    PerumdaRoleCode:
      type: string
      enum: [BUYER, SELLER, AGENT, UNCONFIRMED]
    PriceQuoteStatus:
      type: string
      enum: [DRAFT, PENDING_VERIFICATION, VERIFIED, REJECTED, PUBLISHED, REVOKED]
    PriceDisplayStatus:
      type: string
      enum: [DRAFT, PENDING_VERIFICATION, VERIFIED, REJECTED, PUBLISHED, REVOKED, EXPIRED]
    ReceiptStatus:
      type: string
      enum: [DRAFT, VALIDATED, ALLOCATED, SHIPPED, CLOSED, CANCELLED]
    ContractStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, ACTIVE, SUSPENDED, COMPLETED, CANCELLED]
    DeliveryOrderStatus:
      type: string
      enum: [DRAFT, READY, IN_TRANSIT, ARRIVED, RECEIVED, COMPLETED, CANCELLED]
    MillTicketStatus:
      type: string
      enum: [DRAFT, SUBMITTED, VERIFIED]
    ReconciliationStatus:
      type: string
      enum: [WAITING_TICKET, READY, MATCHED, DISPUTE_HOLD, UNDER_REVIEW, RESOLVED, CANCELLED]
    DisputeDecision:
      type: string
      enum: [KEEP_ORIGIN_WEIGHT, ACCEPT_MILL_WEIGHT, AGREED_SETTLEMENT_WEIGHT, REQUIRE_TICKET_REVISION, HOLD_FOR_AUDIT, CANCEL_CASE]
    InvoiceType:
      type: string
      enum: [ACCOUNTS_RECEIVABLE, ACCOUNTS_PAYABLE]
    InvoiceStatus:
      type: string
      enum: [DRAFT, PENDING_VERIFICATION, VERIFIED, ISSUED, REJECTED, VOID]
    SettlementStatus:
      type: string
      enum: [UNPAID, PENDING_APPROVAL, APPROVED_UNPAID, AWAITING_PAYMENT, PENDING_VERIFICATION, PAID]
    PaymentDirection:
      type: string
      enum: [INBOUND, OUTBOUND]
    PaymentApprovalDecision:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED]
    PaymentRecordStatus:
      type: string
      enum: [DRAFT, PENDING_VERIFICATION, VERIFIED, REJECTED, REVERSED]
    ErrorCode:
      type: string
      enum:
        - AUTH_INVALID_CREDENTIALS
        - AUTH_REQUIRED
        - AUTH_SESSION_EXPIRED
        - AUTH_CSRF_INVALID
        - AUTH_TOO_MANY_REQUESTS
        - AUTH_ACCESS_DENIED
        - AUTH_SCOPE_FORBIDDEN
        - AUTH_OPERATION_FORBIDDEN
        - AUTH_CONFLICT_OF_DUTIES
        - SYS_RESOURCE_NOT_FOUND
        - VAL_REQUIRED_FIELD
        - VAL_INVALID_FORMAT
        - VAL_INVALID_DECIMAL_PRECISION
        - VAL_INVALID_COORDINATES
        - VAL_INVALID_DATE_RANGE
        - MD_DUPLICATE_CODE
        - MD_ENTITY_IN_USE
        - MD_STALE_RECORD_VERSION
        - PRICE_INVALID_AMOUNT
        - PRICE_INVALID_PERIOD
        - PRICE_NOT_VERIFIED
        - PRICE_ALREADY_PUBLISHED
        - PRICE_OVERLAPPING_PERIOD
        - PRICE_INVALID_STATE_TRANSITION
        - TBS_INVALID_WEIGHT
        - TBS_INVALID_GRADING_DEDUCTION
        - TBS_DUPLICATE_RECEIPT
        - TBS_RECEIPT_LOCKED
        - TBS_INVALID_STATE_TRANSITION
        - TBS_STALE_RECORD_VERSION
        - CONTRACT_NOT_ACTIVE
        - CONTRACT_EXPIRED
        - CONTRACT_QUOTA_EXCEEDED
        - CONTRACT_CONCURRENT_CONFLICT
        - CONTRACT_BUSINESS_MODEL_UNCONFIRMED
        - LOG_DELIVERY_ALREADY_ASSIGNED
        - LOG_INVALID_STATE_TRANSITION
        - LOG_CANCELLATION_FORBIDDEN
        - LOG_QR_VERIFICATION_FAILED
        - LOG_STALE_RECORD_VERSION
        - IDM_KEY_CONFLICT_PAYLOAD_MISMATCH
        - IDM_REQUEST_IN_PROGRESS
        - MILL_EDO_MILL_MISMATCH
        - MILL_DUPLICATE_TICKET
        - MILL_EDO_NOT_ELIGIBLE
        - MILL_TICKET_ALREADY_FINAL
        - REC_NOT_READY
        - REC_INVALID_WEIGHT_BASIS
        - REC_WEIGHT_DISPUTE
        - REC_NEGATIVE_DIFFERENCE_HOLD
        - REC_DISPUTE_REASON_REQUIRED
        - REC_INVALID_STATE_TRANSITION
        - REC_ALLOCATION_IMBALANCE
        - REC_ALLOCATION_POLICY_UNCONFIRMED
        - FIN_INVOICE_NOT_VERIFIED
        - FIN_DISPUTE_HOLD_BLOCKED
        - FIN_POLICY_UNCONFIRMED
        - PAY_APPROVAL_REQUIRED
        - PAY_ALREADY_APPROVED
        - PAY_DUPLICATE_PAYMENT
        - PAY_PARTIAL_NOT_SUPPORTED
        - PAY_AMOUNT_EXCEEDS_INVOICE
        - PAY_PROOF_REQUIRED
        - PAY_INVALID_PARTY_PAIRING
        - PAY_INVALID_STATE_TRANSITION
        - SYS_RATE_LIMIT_EXCEEDED
        - SYS_DEPENDENCY_UNAVAILABLE
        - SYS_REQUEST_TIMEOUT
        - SYS_INTERNAL_ERROR

    ValidationErrorDetail:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }
        code: { type: ["string", "null"] }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        details:
          type: ["object", "array", "null"]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error, request_id]
      properties:
        success: { type: boolean, const: false }
        error: { $ref: "#/components/schemas/ErrorBody" }
        request_id: { $ref: "#/components/schemas/RequestId" }

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, page_size, total_items, total_pages, has_next, has_prev]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total_items: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        data_freshness_at: { $ref: "#/components/schemas/NullableUtcTimestamp" }
        simulation_notice: { $ref: "#/components/schemas/NullableString" }
    SimpleSuccessMeta:
      type: object
      additionalProperties: false
      properties:
        data_freshness_at: { $ref: "#/components/schemas/NullableUtcTimestamp" }
        simulation_notice: { $ref: "#/components/schemas/NullableString" }
        idempotency_replayed: { type: ["boolean", "null"] }

    # -------------------------------------------------------------------------
    # Infrastructure & Health Schemas
    # -------------------------------------------------------------------------
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, checked_at]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        checked_at: { $ref: "#/components/schemas/UtcTimestamp" }
        dependencies:
          type: ["object", "null"]
          properties:
            postgresql: { type: string, enum: [up, down] }
            redis: { type: string, enum: [up, down] }

    # -------------------------------------------------------------------------
    # Public Portal Schemas (BR-PUB-001..005)
    # -------------------------------------------------------------------------
    PublicPriceQuote:
      type: object
      additionalProperties: false
      required: [id, mill_id, mill_name, mill_code, regency, price_category_code, price_category_name, unit, source_name, source_type, price_per_kg, effective_from, effective_until, status, display_status, is_expired, updated_at, published_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        mill_id: { $ref: "#/components/schemas/Uuid" }
