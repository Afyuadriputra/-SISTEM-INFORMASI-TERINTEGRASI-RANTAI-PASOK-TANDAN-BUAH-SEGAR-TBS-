        tare_weight_kg: { $ref: "#/components/schemas/NonNegativeDecimalKgString" }
        weighed_at: { $ref: "#/components/schemas/UtcTimestamp" }
        proof_file_id: { $ref: "#/components/schemas/NullableUuid" }
        grading_items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [grading_category, deduction_type, deduction_value, calculation_basis]
            properties:
              grading_category: { type: string }
              deduction_type: { type: string, enum: [WEIGHT_PERCENT, WEIGHT_KG, VALUE_AMOUNT] }
              deduction_value: { $ref: "#/components/schemas/DecimalPercentString" }
              calculation_basis: { type: string }
              notes: { $ref: "#/components/schemas/NullableString" }
    ReviseMillTicketRequest:
