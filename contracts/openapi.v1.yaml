      additionalProperties: false
      required: [decision, reason, final_outcome]
      properties:
        decision: { $ref: "#/components/schemas/DisputeDecision" }
        final_outcome: { type: string, enum: [RESOLVED, CANCELLED] }
        agreed_settlement_weight_kg:
          type: ["string", "null"]
          pattern: "^\\d{1,11}\\.\\d{3}$"
        reason: { type: string, minLength: 5, maxLength: 1000 }
        evidence_file_id: { $ref: "#/components/schemas/NullableUuid" }
    ComputeAllocationsRequest:
      type: object
      additionalProperties: false
      required: [mode, allocation_policy_version_id]
      properties:
        mode: { type: string, enum: [SIMULATION, FINAL] }
        allocation_policy_version_id: { $ref: "#/components/schemas/Uuid" }

    # -------------------------------------------------------------------------
