        is_current: { type: boolean }
        calculated_at: { $ref: "#/components/schemas/NullableUtcTimestamp" }
        resolved_at: { $ref: "#/components/schemas/NullableUtcTimestamp" }
        dispute_reviews: { type: array, items: { $ref: "#/components/schemas/DisputeReview" } }
        farmer_allocations: { type: array, items: { $ref: "#/components/schemas/FarmerSettlementAllocation" } }
    TriggerReconciliationRequest:
