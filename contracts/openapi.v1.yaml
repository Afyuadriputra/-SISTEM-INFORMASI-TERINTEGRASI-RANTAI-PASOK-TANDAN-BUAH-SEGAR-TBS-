        policy_classification: { $ref: "#/components/schemas/PolicyClassification" }
    ReconciliationCase:
      type: object
      additionalProperties: false
      required: [id, delivery_order_id, delivery_order_number, mill_ticket_id, revision_number, origin_weight_kg, mill_weight_kg, difference_weight_kg, difference_percent, tolerance_percent, rule_version_id, tolerance_policy_classification, is_negative_difference, status, is_current, calculated_at, resolved_at, dispute_reviews, farmer_allocations]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        delivery_order_id: { $ref: "#/components/schemas/Uuid" }
        delivery_order_number: { type: string }
        mill_ticket_id: { $ref: "#/components/schemas/NullableUuid" }
        revision_number: { type: integer, minimum: 1 }
        origin_weight_kg: { $ref: "#/components/schemas/NonNegativeDecimalKgString" }
        mill_weight_kg: { $ref: "#/components/schemas/NonNegativeDecimalKgString" }
        difference_weight_kg: { $ref: "#/components/schemas/DecimalKgString", description: "Rumus kanonis BSD §17.4: origin_weight_kg - mill_weight_kg." }
        difference_percent: { $ref: "#/components/schemas/DecimalPercentString" }
        tolerance_percent: { $ref: "#/components/schemas/DecimalPercentString" }
        rule_version_id: { $ref: "#/components/schemas/Uuid" }
        tolerance_policy_classification: { $ref: "#/components/schemas/PolicyClassification" }
