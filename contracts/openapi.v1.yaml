paths:
  # ===========================================================================
  # INFRASTRUCTURE PROBES (TRD §25.1)
  # ===========================================================================
  /health/live:
    get:
      tags: [Infrastructure]
      operationId: getLivenessHealth
      summary: "Liveness probe aplikasi"
      security: []
      responses:
        "200":
          description: "Proses aplikasi aktif."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }

  /health/ready:
    get:
      tags: [Infrastructure]
      operationId: getReadinessHealth
      summary: "Readiness probe PostgreSQL & Redis"
      security: []
      responses:
        "200":
          description: "Dependensi PostgreSQL dan Redis siap."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }
        "503": { $ref: "#/components/responses/ServiceUnavailableResponse" }

  # ===========================================================================
  # PUBLIC PORTAL API (TANPA LOGIN, BR-PUB-001..005)
  # ===========================================================================
  /api/v1/public/prices:
    get:
      tags: [Public Portal]
      operationId: listPublicPrices
      summary: "Daftar harga TBS PKS terverifikasi dan dipublikasikan (`FLOW-02`)"
      description: "Hanya menampilkan harga berstatus PUBLISHED pada PKS `is_public=true`. Data Disbun terpisah pada `/api/v1/public/disbun-prices`."
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SearchQueryParam"
        - $ref: "#/components/parameters/SortDirParam"
        - name: regency
          in: query
          schema: { type: string }
        - name: category_code
          in: query
          schema: { type: string }
        - name: effective_date
          in: query
          schema: { $ref: "#/components/schemas/IsoDate" }
        - name: include_expired
          in: query
          description: "Default false agar harga kedaluwarsa tidak diklaim aktif (`FR-PUB-002`)."
          schema: { type: boolean, default: false }
        - name: sort_by
          in: query
          schema: { type: string, enum: [price_per_kg, mill_name, updated_at], default: price_per_kg }
      responses:
        "200":
          description: "Daftar harga publik (termasuk daftar kosong jika belum ada penawaran aktif)."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPriceListEnvelope" }
              example:
                success: true
                data:
                  - id: "20000000-0000-4000-8000-000000000201"
                    mill_id: "10000000-0000-4000-8000-000000000301"
                    mill_name: "PKS Pangkalan Kerinci"
                    mill_code: "PKS-PKC-01"
                    regency: "Pelalawan"
                    price_category_code: "SWADAYA_STD"
                    price_category_name: "TBS Sawit Swadaya"
                    unit: "IDR/kg"
                    source_name: "Informasi Resmi PKS Pangkalan Kerinci"
                    source_type: "MILL_OFFICIAL"
                    price_per_kg: "2920.00"
                    effective_from: "2026-11-10T01:00:00Z"
                    effective_until: "2026-11-10T16:59:59Z"
                    status: "PUBLISHED"
                    display_status: "PUBLISHED"
                    is_expired: false
                    updated_at: "2026-11-10T01:30:00Z"
                    published_at: "2026-11-10T01:30:00Z"
                    is_simulation: true
                meta:
                  page: 1
                  page_size: 20
                  total_items: 1
                  total_pages: 1
                  has_next: false
                  has_prev: false
                  data_freshness_at: "2026-11-10T01:30:00Z"
                  simulation_notice: "Data Simulasi — Bukan tarif komersial resmi Perumda."
                request_id: "req_pub_prices_001"
        "429": { $ref: "#/components/responses/RateLimitResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailableResponse" }

  /api/v1/public/prices/{price_quote_id}:
    get:
      tags: [Public Portal]
      operationId: getPublicPriceDetail
      summary: "Detail harga PKS publik dan riwayat kategori setara (`P03`)"
      security: []
      parameters:
        - $ref: "#/components/parameters/PriceQuoteIdPath"
      responses:
        "200":
          description: "Detail harga publik terverifikasi beserta riwayat."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPriceDetailEnvelope" }
        "404": { $ref: "#/components/responses/NotFoundResponse" }

  /api/v1/public/disbun-prices:
    get:
      tags: [Public Portal]
      operationId: listPublicDisbunPrices
      summary: "Daftar harga acuan resmi Disbun Riau terpisah dari penawaran PKS (`FR-PUB-004`)"
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: "Daftar harga acuan Disbun."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicDisbunPriceListEnvelope" }

  /api/v1/public/mills:
    get:
      tags: [Public Portal]
      operationId: listPublicMills
      summary: "Direktori dan lokasi PKS publik terkurasi (`FLOW-03`, `is_public=true`)"
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SearchQueryParam"
        - name: regency
          in: query
          schema: { type: string }
        - name: district
          in: query
          schema: { type: string }
      responses:
        "200":
          description: "Daftar PKS publik tanpa kontak privat maupun data kontrak."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMillListEnvelope" }
        "429": { $ref: "#/components/responses/RateLimitResponse" }

  /api/v1/public/mills/{mill_id}:
    get:
      tags: [Public Portal]
      operationId: getPublicMillDetail
      summary: "Profil publik PKS mitra (`P05 /pks/:id`)"
      security: []
      parameters:
        - $ref: "#/components/parameters/MillIdPath"
      responses:
        "200":
          description: "Detail publik PKS tanpa kontrak/kuota rahasia (`BR-PUB-003`)."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMillDetailEnvelope" }
        "404": { $ref: "#/components/responses/NotFoundResponse" }

  /api/v1/public/profile:
    get:
      tags: [Public Portal]
      operationId: getPublicProfile
      summary: "Profil Perumda Unit Agro Niaga, Informasi Kemitraan, & Kontak Kantor (`P06-P08`)"
      security: []
      responses:
        "200":
          description: "Konten publik terverifikasi untuk `/tentang`, `/kemitraan`, dan `/kontak`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfileEnvelope" }

  /api/v1/public/notices:
    get:
      tags: [Public Portal]
      operationId: listPublicNotices
      summary: "Pengumuman resmi Portal Publik yang sedang aktif"
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: "Daftar pengumuman PUBLISHED."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicNoticeListEnvelope" }

  # ===========================================================================
  # AUTHENTICATION & SESSION API (`FLOW-04`, `TRD §12-13`)
  # ===========================================================================
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: "Ambil token CSRF terikat sesi untuk operasi mutasi"
      security: []
      responses:
        "200":
          description: "Token CSRF yang dikirim melalui header `X-CSRF-Token`."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfEnvelope" }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: "Autentikasi pengguna internal dan pembuatan session cookie HttpOnly"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: "Login berhasil; Set-Cookie `ts_agroniaga_session` HttpOnly dikirim oleh server."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            Set-Cookie:
              description: "Server-side session cookie HttpOnly; Secure; SameSite=Lax"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
        "401": { $ref: "#/components/responses/UnauthorizedResponse" }
        "422": { $ref: "#/components/responses/ValidationErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimitResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailableResponse" }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: "Pencabutan sesi server-side dan penghapusan cookie"
      security:
        - SessionCookieAuth: []
          CsrfTokenHeader: []
      responses:
        "200":
          description: "Sesi dicabut dan cookie dibersihkan."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutEnvelope" }
        "401": { $ref: "#/components/responses/UnauthorizedResponse" }
        "403": { $ref: "#/components/responses/ForbiddenResponse" }

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: "Membaca identitas pengguna aktif, peran, dan scope akses"
      security:
        - SessionCookieAuth: []
      responses:
        "200":
          description: "Profil akun tanpa password_hash maupun token sesi."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
        "401": { $ref: "#/components/responses/UnauthorizedResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailableResponse" }

  # ===========================================================================
  # MASTER DATA API (`FLOW-05`, `FLOW-06`, `PRD §8`)
  # ===========================================================================
  /api/v1/farmers:
    get:
      tags: [Master Data]
      operationId: listFarmers
      summary: "Daftar petani sesuai cakupan organisasi (`FLOW-05`)"
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SearchQueryParam"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EntityStatus" }
      responses:
        "200":
          description: "Daftar petani sesuai scope."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
