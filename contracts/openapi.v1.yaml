    ReceiptWeighingRevision:
      type: object
      additionalProperties: false
      required: [id, revision_number, gross_weight_kg, tare_weight_kg, net_weight_kg, weighed_at, weighed_by, is_current, correction_reason]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        revision_number: { type: integer, minimum: 1 }
        gross_weight_kg: { $ref: "#/components/schemas/NonNegativeDecimalKgString" }
        tare_weight_kg: { $ref: "#/components/schemas/NonNegativeDecimalKgString" }
        net_weight_kg: { $ref: "#/components/schemas/NonNegativeDecimalKgString", description: "Dihitung secara otoritatif oleh backend: gross - tare." }
        weighed_at: { $ref: "#/components/schemas/UtcTimestamp" }
        weighed_by: { $ref: "#/components/schemas/Uuid" }
        is_current: { type: boolean }
        correction_reason: { $ref: "#/components/schemas/NullableString" }
    ReceiptGradingItem:
      type: object
      additionalProperties: false
      required: [id, grading_category, measurement_value, deduction_type, deduction_value, deduction_weight_kg, deduction_amount, calculation_basis, is_simulation]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        grading_category: { type: string }
        measurement_value: { $ref: "#/components/schemas/DecimalPercentString" }
        deduction_type: { type: string, enum: [WEIGHT_PERCENT, WEIGHT_KG, VALUE_AMOUNT] }
        deduction_value: { $ref: "#/components/schemas/DecimalPercentString" }
        deduction_weight_kg:
          type: ["string", "null"]
          pattern: "^\\d{1,11}\\.\\d{3}$"
        deduction_amount:
          type: ["string", "null"]
          pattern: "^-?\\d{1,18}\\.\\d{2}$"
        calculation_basis: { type: string, example: "NET_WEIGHT_BEFORE_GRADING" }
        is_simulation: { type: boolean, description: "True selama formula grading berstatus SIMULATION_ONLY (BSD-DEC-006)." }
        notes: { $ref: "#/components/schemas/NullableString" }
    TbsReceipt:
      type: object
      additionalProperties: false
      required: [id, receipt_number, farmer_id, farmer_name, farm_id, farm_name, cooperative_id, harvest_date, received_at, status, net_weight_after_grading_kg, current_weighing, grading_items, version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        receipt_number: { type: string }
        farmer_id: { $ref: "#/components/schemas/Uuid" }
        farmer_name: { type: string }
        farm_id: { $ref: "#/components/schemas/Uuid" }
        farm_name: { type: string }
        cooperative_id: { $ref: "#/components/schemas/Uuid" }
        harvest_date: { $ref: "#/components/schemas/NullableIsoDate" }
        received_at: { $ref: "#/components/schemas/UtcTimestamp" }
        status: { $ref: "#/components/schemas/ReceiptStatus" }
        current_weighing:
          anyOf:
            - $ref: "#/components/schemas/ReceiptWeighingRevision"
            - { type: "null" }
        net_weight_after_grading_kg:
          type: ["string", "null"]
          pattern: "^\\d{1,11}\\.\\d{3}$"
          description: "Disimpan terpisah dari current_weighing.net_weight_kg agar potongan tidak diterapkan ganda."
        weighing_revisions:
          type: array
          items: { $ref: "#/components/schemas/ReceiptWeighingRevision" }
        grading_items:
          type: array
          items: { $ref: "#/components/schemas/ReceiptGradingItem" }
        version: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        updated_at: { $ref: "#/components/schemas/UtcTimestamp" }
    CreateReceiptRequest:
      type: object
      additionalProperties: false
      required: [farmer_id, farm_id, received_at]
      properties:
        farmer_id: { $ref: "#/components/schemas/Uuid" }
        farm_id: { $ref: "#/components/schemas/Uuid" }
        harvest_date: { $ref: "#/components/schemas/NullableIsoDate" }
        received_at: { $ref: "#/components/schemas/UtcTimestamp" }
        notes: { $ref: "#/components/schemas/NullableString" }
    RecordWeighingRequest:
      type: object
      additionalProperties: false
      required: [gross_weight_kg, tare_weight_kg, version]
      properties:
        gross_weight_kg: { $ref: "#/components/schemas/NonNegativeDecimalKgString" }
        tare_weight_kg: { $ref: "#/components/schemas/NonNegativeDecimalKgString" }
        correction_reason: { $ref: "#/components/schemas/NullableString" }
        version: { type: integer, minimum: 1 }
    RecordGradingRequest:
      type: object
      additionalProperties: false
      required: [items, version]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [grading_category, measurement_value, deduction_type, deduction_value, calculation_basis]
            properties:
              grading_category: { type: string }
              measurement_value: { $ref: "#/components/schemas/DecimalPercentString" }
              deduction_type: { type: string, enum: [WEIGHT_PERCENT, WEIGHT_KG, VALUE_AMOUNT] }
              deduction_value: { $ref: "#/components/schemas/DecimalPercentString" }
              calculation_basis: { type: string }
              notes: { $ref: "#/components/schemas/NullableString" }
        version: { type: integer, minimum: 1 }
    ReasonActionRequest:
      type: object
      additionalProperties: false
      required: [reason, version]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
        version: { type: integer, minimum: 1 }

